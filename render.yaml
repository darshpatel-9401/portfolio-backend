services:
  - type: web
    name: portfolio-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0" 
      - key: PORT
        value: "10000"
      - key: MONGO_URI
        sync: false 
      - key: JWT_SECRET
        sync: false 